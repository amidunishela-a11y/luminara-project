<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | AI MEDIA HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        
        body {
            margin: 0; background-color: var(--bg); color: #fff;
            font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid rgba(0, 242, 255, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            backdrop-filter: blur(10px); z-index: 10;
        }

        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: bold; color: var(--neon); letter-spacing: 4px; margin-bottom: 50px; }

        .nav-item {
            padding: 15px; margin-bottom: 10px; border-radius: 8px;
            cursor: pointer; color: #888; transition: 0.3s; font-size: 0.85rem;
            font-family: 'Orbitron'; display: flex; align-items: center; gap: 10px;
        }

        .nav-item.active, .nav-item:hover { color: var(--neon); background: rgba(0, 242, 255, 0.1); }

        /* Main Content */
        .content { flex: 1; padding: 30px; overflow-y: auto; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }

        /* Sections Control */
        .section { width: 100%; max-width: 900px; display: none; }
        .section.active { display: block; }

        /* Media Player Container */
        .player-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px;
            border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        #video-preview { width: 100%; border-radius: 10px; border: 1px solid #222; background: #000; display: none; }

        .upload-placeholder {
            height: 300px; border: 2px dashed rgba(0, 242, 255, 0.3);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; border-radius: 10px; transition: 0.3s;
        }
        .upload-placeholder:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }

        /* Controls */
        .tools-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px;
            padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px;
        }

        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .input-box input, .input-box select { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2);
            color: #fff; padding: 12px; border-radius: 5px; outline: none; font-family: 'Orbitron';
        }

        .convert-btn {
            grid-column: span 2; background: var(--neon); color: #000;
            border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .convert-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }

        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }

        #status-msg, #yt-status-msg { text-align: center; font-size: 0.8rem; color: var(--neon); margin-top: 10px; }

        /* YouTube Tab Styles */
        .yt-input { width: 100%; box-sizing: border-box; }
        .download-option { margin-top: 20px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <div class="nav-item active" onclick="showSection('local-extractor', this)">
            <i class="fas fa-cut"></i> LOCAL EXTRACTOR
        </div>
        <div class="nav-item" onclick="showSection('youtube-downloader', this)">
            <i class="fab fa-youtube"></i> YT DOWNLOADER
        </div>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="header">
            <h2 id="section-title" style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon);">AUDIO EXTRACTION UNIT</h2>
            <div id="user-display" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888;">ID: GUEST</div>
        </div>

        <div id="local-extractor" class="section active">
            <div class="player-card">
                <input type="file" id="video-input" accept="video/mp4" style="display: none;">
                <div class="upload-placeholder" id="drop-zone" onclick="document.getElementById('video-input').click()">
                    <i class="fas fa-file-video" style="font-size: 3rem; color: var(--neon); margin-bottom: 15px;"></i>
                    <p style="font-family: 'Orbitron'; font-size: 0.8rem;">UPLOAD MP4 VIDEO DATA</p>
                </div>
                <video id="video-preview" controls></video>
                <div class="tools-grid" id="tools-ui" style="display: none;">
                    <div class="input-box">
                        <label><i class="fas fa-step-backward"></i> START POINT (SEC)</label>
                        <input type="number" id="start-time" value="0" min="0" step="0.1">
                    </div>
                    <div class="input-box">
                        <label><i class="fas fa-step-forward"></i> END POINT (SEC)</label>
                        <input type="number" id="end-time" value="10" step="0.1">
                    </div>
                    <button class="convert-btn" id="convert-btn" onclick="extractAudio()">
                        PROCESS & DOWNLOAD MP3
                    </button>
                    <div id="status-msg">READY FOR COMMAND...</div>
                </div>
            </div>
        </div>

        <div id="youtube-downloader" class="section">
            <div class="player-card">
                <div class="tools-grid">
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fab fa-youtube"></i> YOUTUBE VIDEO LINK</label>
                        <input type="text" id="yt-url" class="yt-input" placeholder="Paste YouTube link here...">
                    </div>
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fas fa-file-download"></i> SELECT FORMAT</label>
                        <select id="yt-format">
                            <option value="mp3">MP3 (Audio Only)</option>
                            <option value="mp4">MP4 (Video 720p)</option>
                        </select>
                    </div>
                    <button class="convert-btn" onclick="downloadYoutube()">
                        GENERATE CLOUD DOWNLOAD LINK
                    </button>
                    <div id="yt-status-msg">ENTER LINK TO START CLOUD EXTRACTION...</div>
                    <div id="yt-result" style="grid-column: span 2; text-align: center; margin-top: 15px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js"></script>

    <script>
        // Section Switching Logic
        function showSection(id, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            
            document.getElementById(id).classList.add('active');
            element.classList.add('active');
            
            const title = document.getElementById('section-title');
            title.innerText = (id === 'local-extractor') ? "AUDIO EXTRACTION UNIT" : "YOUTUBE CLOUD HUB";
        }

        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        const toolsUi = document.getElementById('tools-ui');
        const statusMsg = document.getElementById('status-msg');
        const dropZone = document.getElementById('drop-zone');

        // Handle Local File Selection
        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                dropZone.style.display = 'none';
                toolsUi.style.display = 'grid';
                videoPreview.onloadedmetadata = () => {
                    document.getElementById('end-time').value = videoPreview.duration.toFixed(1);
                };
            }
        };

        // Local Extraction Function
        async function extractAudio() {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: false });
            const file = videoInput.files[0];
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            const btn = document.getElementById('convert-btn');

            if (!file) return;
            btn.disabled = true;
            statusMsg.innerText = "INITIALIZING CORE ENGINE...";

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                statusMsg.innerText = "EXTRACTING AUDIO DATA...";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
                await ffmpeg.run('-ss', start, '-to', end, '-i', 'input.mp4', '-q:a', '2', '-map', 'a', 'output.mp3');
                const data = ffmpeg.FS('readFile', 'output.mp3');
                const audioUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                const link = document.createElement('a');
                link.href = audioUrl;
                link.download = `LUMINARA_EXTRACT_${Date.now()}.mp3`;
                link.click();
                statusMsg.innerText = "COMMAND EXECUTED SUCCESSFULLY.";
            } catch (err) {
                statusMsg.innerText = "ERROR: TRANSCODING FAILED.";
            } finally {
                btn.disabled = false;
            }
        }

        // --- YouTube Downloader Function ---
        function downloadYoutube() {
            const url = document.getElementById('yt-url').value;
            const format = document.getElementById('yt-format').value;
            const status = document.getElementById('yt-status-msg');
            const resultDiv = document.getElementById('yt-result');

            if (!url) {
                status.innerText = "ERROR: PLEASE PASTE A YOUTUBE LINK.";
                return;
            }

            status.innerText = "PROCESSING CLOUD LINK... PLEASE WAIT.";
            
            // අපි මෙතනදි use කරන්නේ direct download links දෙන free API එකක්. 
            // මෙහිදී user ට download කරගැනීමට button එකක් generate කර දෙනු ලැබේ.
            const api_url = `https://loader.to/api/button/?url=${encodeURIComponent(url)}&f=${format}`;
            
            resultDiv.innerHTML = `<iframe src="${api_url}" width="100%" height="100px" scrolling="no" style="border:none;"></iframe>`;
            status.innerText = "GENERATED. CLICK THE BUTTON BELOW TO DOWNLOAD.";
        }

        // Auth Display
        document.getElementById('user-display').innerText = `ID: ${localStorage.getItem('loggedEmail') || "GUEST"}`;
        function logout() { localStorage.removeItem('loggedEmail'); window.location.href = 'index.html'; }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
