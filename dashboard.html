<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | AI MEDIA HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        body { margin: 0; background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: rgba(0, 0, 0, 0.8); border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: bold; color: var(--neon); letter-spacing: 4px; margin-bottom: 50px; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; color: #888; transition: 0.3s; font-size: 0.85rem; font-family: 'Orbitron'; display: flex; align-items: center; gap: 10px; }
        .nav-item.active, .nav-item:hover { color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .content { flex: 1; padding: 30px; overflow-y: auto; position: relative; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .section { width: 100%; max-width: 900px; display: none; }
        .section.active { display: block; }
        .player-card { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); }
        #video-preview { width: 100%; border-radius: 10px; border: 1px solid #222; background: #000; display: none; }
        .upload-placeholder { height: 300px; border: 2px dashed rgba(0, 242, 255, 0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .upload-placeholder:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .input-box input, .input-box select { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2); color: #fff; padding: 12px; border-radius: 5px; outline: none; font-family: 'Orbitron'; }
        .convert-btn { grid-column: span 2; background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .convert-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }
        #status-msg, #yt-status-msg { text-align: center; font-size: 0.8rem; color: var(--neon); margin-top: 10px; font-family: 'Orbitron'; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <div class="nav-item active" onclick="showSection('local-extractor', this)">
            <i class="fas fa-cut"></i> LOCAL EXTRACTOR
        </div>
        <div class="nav-item" onclick="showSection('youtube-downloader', this)">
            <i class="fab fa-youtube"></i> YT DOWNLOADER
        </div>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="header">
            <h2 id="section-title" style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon);">AUDIO EXTRACTION UNIT</h2>
            <div id="user-display" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888;">ID: GUEST</div>
        </div>

        <div id="local-extractor" class="section active">
            <div class="player-card">
                <input type="file" id="video-input" accept="video/mp4" style="display: none;">
                <div class="upload-placeholder" id="drop-zone" onclick="document.getElementById('video-input').click()">
                    <i class="fas fa-file-video" style="font-size: 3rem; color: var(--neon); margin-bottom: 15px;"></i>
                    <p style="font-family: 'Orbitron'; font-size: 0.8rem;">UPLOAD MP4 VIDEO DATA</p>
                </div>
                <video id="video-preview" controls></video>
                <div class="tools-grid" id="tools-ui" style="display: none;">
                    <div class="input-box">
                        <label>START POINT (SEC)</label>
                        <input type="number" id="start-time" value="0" min="0" step="0.1">
                    </div>
                    <div class="input-box">
                        <label>END POINT (SEC)</label>
                        <input type="number" id="end-time" value="10" step="0.1">
                    </div>
                    <button class="convert-btn" id="convert-btn" onclick="extractAudioDirect()">PROCESS & DOWNLOAD MP3</button>
                    <div id="status-msg">READY FOR COMMAND...</div>
                </div>
            </div>
        </div>

        <div id="youtube-downloader" class="section">
            <div class="player-card">
                <div class="tools-grid">
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fab fa-youtube"></i> YOUTUBE VIDEO LINK</label>
                        <input type="text" id="yt-url" placeholder="Paste link here to download instantly..." oninput="autoDownloadCheck()">
                    </div>
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fas fa-file-download"></i> PREFERRED FORMAT</label>
                        <select id="yt-format" onchange="autoDownloadCheck()">
                            <option value="mp3">MP3 (High Quality Audio)</option>
                            <option value="360">MP4 (360p Video)</option>
                            <option value="720">MP4 (720p Video)</option>
                            <option value="1080">MP4 (1080p Full HD)</option>
                        </select>
                    </div>
                    <div id="yt-status-msg">WAITING FOR YOUTUBE LINK...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showSection(id, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            element.classList.add('active');
            document.getElementById('section-title').innerText = (id === 'local-extractor') ? "AUDIO EXTRACTION UNIT" : "INSTANT YT DOWNLOADER";
        }

        // YouTube Instant Download Logic
        function autoDownloadCheck() {
            const url = document.getElementById('yt-url').value;
            const status = document.getElementById('yt-status-msg');
            if (url.includes("youtube.com/") || url.includes("youtu.be/")) {
                status.innerText = "LINK DETECTED! REDIRECTING TO DOWNLOAD...";
                status.style.color = "#00ff00";
                const downloadLink = `https://9xbuddy.com/process?url=${encodeURIComponent(url)}`;
                setTimeout(() => {
                    window.open(downloadLink, '_blank');
                    status.innerText = "DOWNLOAD STARTED. READY FOR NEXT LINK.";
                    document.getElementById('yt-url').value = "";
                }, 1500);
            }
        }

        // --- Direct MP3 Extraction (No Engine Required) ---
        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        
        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.style.display = 'block';
                document.getElementById('drop-zone').style.display = 'none';
                document.getElementById('tools-ui').style.display = 'grid';
                videoPreview.onloadedmetadata = () => {
                    document.getElementById('end-time').value = videoPreview.duration.toFixed(1);
                };
            }
        };

        async function extractAudioDirect() {
            const file = videoInput.files[0];
            const startTime = parseFloat(document.getElementById('start-time').value);
            const endTime = parseFloat(document.getElementById('end-time').value);
            const btn = document.getElementById('convert-btn');
            const status = document.getElementById('status-msg');

            if (!file) return;

            btn.disabled = true;
            status.innerText = "PROCESSING AUDIO... PLEASE WAIT";

            try {
                // Browser එකේම ඇති Web Audio API එක භාවිතයෙන් Audio extract කිරීම
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const sampleRate = audioBuffer.sampleRate;
                const startOffset = startTime * sampleRate;
                const endOffset = endTime * sampleRate;
                const frameCount = endOffset - startOffset;

                const newBuffer = audioCtx.createBuffer(
                    audioBuffer.numberOfChannels,
                    frameCount,
                    sampleRate
                );

                for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                    const channelData = audioBuffer.getChannelData(i);
                    newBuffer.copyToChannel(channelData.subarray(startOffset, endOffset), i);
                }

                // WAV ගොනුවක් ලෙස සකසා MP3 ලෙස නම් කර බාගත කිරීම
                const wavData = bufferToWav(newBuffer);
                const blob = new Blob([wavData], { type: 'audio/mp3' });
                const url = URL.createObjectURL(blob);

                const link = document.createElement('a');
                link.href = url;
                link.download = `LUMINARA_AUDIO_${Date.now()}.mp3`;
                link.click();

                status.innerText = "SUCCESSFULLY DOWNLOADED TO DEVICE.";
            } catch (err) {
                console.error(err);
                status.innerText = "ERROR: EXTRACTION FAILED.";
            } finally {
                btn.disabled = false;
            }
        }

        // Helper function: AudioBuffer එක WAV (MP3 compatible) format එකට හරවයි
        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels,
                length = abuffer.length * numOfChan * 2 + 44,
                buffer = new ArrayBuffer(length),
                view = new DataView(buffer),
                channels = [], i, sample,
                offset = 0, pos = 0;

            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
            setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
            setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);

            for (i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
            while (pos < length) {
                for (i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
                    view.setInt16(pos, sample, true); pos += 2;
                }
                offset++;
            }
            return buffer;
        }

        document.getElementById('user-display').innerText = `ID: ${localStorage.getItem('loggedEmail') || "GUEST"}`;
        function logout() { localStorage.removeItem('loggedEmail'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
