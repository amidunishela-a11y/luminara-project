<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | AI MEDIA HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        body { margin: 0; background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: rgba(0, 0, 0, 0.8); border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: bold; color: var(--neon); letter-spacing: 4px; margin-bottom: 50px; }
        .nav-item { padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; color: #888; transition: 0.3s; font-size: 0.85rem; font-family: 'Orbitron'; display: flex; align-items: center; gap: 10px; }
        .nav-item.active, .nav-item:hover { color: var(--neon); background: rgba(0, 242, 255, 0.1); }
        .content { flex: 1; padding: 30px; overflow-y: auto; position: relative; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }
        .section { width: 100%; max-width: 900px; display: none; }
        .section.active { display: block; }
        .player-card { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); }
        #video-preview { width: 100%; border-radius: 10px; border: 1px solid #222; background: #000; display: none; }
        .upload-placeholder { height: 300px; border: 2px dashed rgba(0, 242, 255, 0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .upload-placeholder:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .input-box input, .input-box select { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2); color: #fff; padding: 12px; border-radius: 5px; outline: none; font-family: 'Orbitron'; }
        .convert-btn { grid-column: span 2; background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .convert-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }
        #status-msg, #social-status-msg, #mail-status { text-align: center; font-size: 0.8rem; color: var(--neon); margin-top: 10px; font-family: 'Orbitron'; }

        /* Temp Mail Design */
        .mail-box { display: flex; gap: 10px; margin-bottom: 20px; }
        .mail-display { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--neon); padding: 15px; border-radius: 5px; color: var(--neon); font-family: 'Orbitron'; font-size: 0.85rem; text-align: center; letter-spacing: 1px; }
        .copy-btn { background: var(--neon); color: #000; border: none; padding: 0 20px; border-radius: 5px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; }
        .inbox-container { margin-top: 20px; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 15px; min-height: 200px; border: 1px solid rgba(0,242,255,0.1); }
        .mail-item { border-bottom: 1px solid rgba(0,242,255,0.2); padding: 12px; cursor: pointer; transition: 0.3s; text-align: left; }
        .mail-item:hover { background: rgba(0,242,255,0.1); }
        .mail-subject { color: var(--neon); font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
        .mail-from { color: #888; font-size: 0.7rem; }
        
        /* Modal for Reading Mail */
        #mail-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; padding: 50px; box-sizing: border-box; }
        .modal-content { background: var(--bg); border: 1px solid var(--neon); max-width: 700px; margin: auto; padding: 30px; border-radius: 15px; height: 80vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 20px; right: 20px; color: #ff4d4d; cursor: pointer; font-family: 'Orbitron'; }
    </style>
</head>
<body>

    <div id="mail-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeMail()">CLOSE [X]</span>
            <h2 id="view-subject" style="color:var(--neon); font-family:'Orbitron';"></h2>
            <p id="view-from" style="color:#888; font-size:0.8rem;"></p>
            <hr style="border:0.5px solid rgba(0,242,255,0.2);">
            <div id="view-body" style="line-height: 1.6; margin-top: 20px;"></div>
        </div>
    </div>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <div class="nav-item active" onclick="showSection('local-extractor', this)">
            <i class="fas fa-cut"></i> LOCAL EXTRACTOR
        </div>
        <div class="nav-item" onclick="showSection('social-downloader', this)">
            <i class="fas fa-cloud-download-alt"></i> SOCIAL DOWNLOADER
        </div>
        <div class="nav-item" onclick="showSection('temp-mail', this)">
            <i class="fas fa-envelope-open-text"></i> TEMP MAIL
        </div>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="header">
            <h2 id="section-title" style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon);">AUDIO EXTRACTION UNIT</h2>
            <div id="user-display" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888;">ID: GUEST</div>
        </div>

        <div id="local-extractor" class="section active">
            <div class="player-card">
                <input type="file" id="video-input" accept="video/mp4" style="display: none;">
                <div class="upload-placeholder" id="drop-zone" onclick="document.getElementById('video-input').click()">
                    <i class="fas fa-file-video" style="font-size: 3rem; color: var(--neon); margin-bottom: 15px;"></i>
                    <p style="font-family: 'Orbitron'; font-size: 0.8rem;">UPLOAD MP4 VIDEO DATA</p>
                </div>
                <video id="video-preview" controls></video>
                <div class="tools-grid" id="tools-ui" style="display: none;">
                    <div class="input-box">
                        <label>START POINT (SEC)</label>
                        <input type="number" id="start-time" value="0" min="0" step="0.1">
                    </div>
                    <div class="input-box">
                        <label>END POINT (SEC)</label>
                        <input type="number" id="end-time" value="10" step="0.1">
                    </div>
                    <button class="convert-btn" id="convert-btn" onclick="processLocalAudio()">PROCESS & DOWNLOAD MP3</button>
                    <div id="status-msg">READY FOR COMMAND...</div>
                </div>
            </div>
        </div>

        <div id="social-downloader" class="section">
            <div class="player-card">
                <div class="tools-grid">
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fas fa-link"></i> YT / FACEBOOK VIDEO LINK</label>
                        <input type="text" id="social-url" placeholder="Paste link here to download instantly..." oninput="autoSocialDownload()">
                    </div>
                    <div class="input-box" style="grid-column: span 2;">
                        <label><i class="fas fa-file-download"></i> PREFERRED FORMAT</label>
                        <select id="social-format" onchange="autoSocialDownload()">
                            <option value="mp3">MP3 (Audio Only)</option>
                            <option value="hd">MP4 (HD Quality Video)</option>
                            <option value="sd">MP4 (Standard Quality)</option>
                        </select>
                    </div>
                    <div id="social-status-msg">WAITING FOR LINK...</div>
                </div>
            </div>
        </div>

        <div id="temp-mail" class="section">
            <div class="player-card">
                <h3 style="font-family: 'Orbitron'; font-size: 0.8rem; color: #888; margin-bottom: 15px; text-align: center;">TEMPORARY ANONYMOUS MAILBOX</h3>
                <div class="mail-box">
                    <div id="current-mail" class="mail-display">GENERATING ADDRESS...</div>
                    <button class="copy-btn" onclick="copyMail()"><i class="fas fa-copy"></i></button>
                </div>
                <button class="convert-btn" onclick="generateNewMail()">GENERATE NEW ADDRESS</button>
                <div id="mail-status">AUTO-REFRESH: ACTIVE (5S)</div>
                
                <div class="inbox-container" id="inbox">
                    <p style="text-align: center; color: #444; font-family: 'Orbitron'; font-size: 0.7rem; margin-top: 80px;">INBOX EMPTY - AWAITING ENCRYPTED DATA...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showSection(id, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            element.classList.add('active');
            
            const titles = {
                'local-extractor': 'AUDIO EXTRACTION UNIT',
                'social-downloader': 'INSTANT SOCIAL DOWNLOADER',
                'temp-mail': 'TEMPORARY MAIL SERVICE'
            };
            document.getElementById('section-title').innerText = titles[id];
            
            if(id === 'temp-mail' && !currentEmail) generateNewMail();
        }

        // --- Temp Mail Logic ---
        let currentEmail = "";
        let displayEmail = ""; 
        let mailCheckInterval = null;

        function generateNewMail() {
            // Generate English Letters (5) + Numbers (3)
            const letters = "abcdefghijklmnopqrstuvwxyz";
            const numbers = "0123456789";
            let user = "";
            for(let i=0; i<5; i++) user += letters.charAt(Math.floor(Math.random() * letters.length));
            for(let i=0; i<3; i++) user += numbers.charAt(Math.floor(Math.random() * numbers.length));
            
            const domains = ["suko.com", "sayiyo.com", "nishela.com", "amidu.com"];
            const randomDisplayDomain = domains[Math.floor(Math.random() * domains.length)];
            
            // API setup (Using 1secmail for actual logic)
            currentEmail = `${user}@1secmail.com`;
            displayEmail = `${user}@${randomDisplayDomain}`;
            
            document.getElementById('current-mail').innerText = displayEmail;
            document.getElementById('inbox').innerHTML = '<p style="text-align:center; color:#444; font-family:Orbitron; font-size:0.7rem; margin-top:80px;">AWAITING DATA...</p>';
            
            if(mailCheckInterval) clearInterval(mailCheckInterval);
            mailCheckInterval = setInterval(checkInbox, 5000);
        }

        async function checkInbox() {
            if(!currentEmail) return;
            const [user, domain] = currentEmail.split('@');
            try {
                const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${user}&domain=${domain}`);
                const emails = await res.json();
                const inboxDiv = document.getElementById('inbox');
                
                if(emails.length > 0) {
                    inboxDiv.innerHTML = emails.map(email => `
                        <div class="mail-item" onclick="readMail(${email.id})">
                            <div class="mail-subject">${email.subject}</div>
                            <div class="mail-from">From: ${email.from} | ${email.date}</div>
                        </div>
                    `).join('');
                }
            } catch (e) { }
        }

        async function readMail(id) {
            const [user, domain] = currentEmail.split('@');
            try {
                const res = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${user}&domain=${domain}&id=${id}`);
                const data = await res.json();
                
                document.getElementById('view-subject').innerText = data.subject;
                document.getElementById('view-from').innerText = "From: " + data.from + " | " + data.date;
                document.getElementById('view-body').innerHTML = data.htmlBody || data.body;
                document.getElementById('mail-modal').style.display = "block";
            } catch (e) { alert("Error reading mail."); }
        }

        function closeMail() {
            document.getElementById('mail-modal').style.display = "none";
        }

        function copyMail() {
            navigator.clipboard.writeText(displayEmail);
            const btn = document.querySelector('.copy-btn');
            const original = btn.innerHTML;
            btn.innerText = "OK";
            setTimeout(() => btn.innerHTML = original, 1500);
        }

        // --- Existing Functions (Untouched) ---
        function autoSocialDownload() {
            const url = document.getElementById('social-url').value;
            const status = document.getElementById('social-status-msg');
            if (!url) return;
            if (url.includes("facebook.com") || url.includes("fb.watch") || url.includes("youtube.com") || url.includes("youtu.be")) {
                status.innerText = "LINK RECOGNIZED! PROCESSING...";
                status.style.color = "#00f2ff";
                const finalLink = url.includes("facebook.com") ? `https://fdown.net/download.php?url=${encodeURIComponent(url)}` : `https://9xbuddy.com/process?url=${encodeURIComponent(url)}`;
                setTimeout(() => { window.open(finalLink, '_blank'); status.innerText = "COMMAND EXECUTED."; document.getElementById('social-url').value = ""; }, 1200);
            }
        }

        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.style.display = 'block';
                document.getElementById('drop-zone').style.display = 'none';
                document.getElementById('tools-ui').style.display = 'grid';
                videoPreview.onloadedmetadata = () => document.getElementById('end-time').value = videoPreview.duration.toFixed(1);
            }
        };

        async function processLocalAudio() {
            const btn = document.getElementById('convert-btn');
            const start = parseFloat(document.getElementById('start-time').value);
            const end = parseFloat(document.getElementById('end-time').value);
            const file = videoInput.files[0];
            if (!file) return;
            btn.disabled = true;
            document.getElementById('status-msg').innerText = "PROCESSING AUDIO...";
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                const sampleRate = audioBuffer.sampleRate;
                const startOffset = start * sampleRate;
                const endOffset = end * sampleRate;
                const frameCount = endOffset - startOffset;
                const newBuffer = audioCtx.createBuffer(audioBuffer.numberOfChannels, frameCount, sampleRate);
                for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                    newBuffer.copyToChannel(audioBuffer.getChannelData(i).subarray(startOffset, endOffset), i);
                }
                const wavBlob = bufferToWav(newBuffer);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(wavBlob);
                link.download = `LUMINARA_AUDIO_${Date.now()}.mp3`;
                link.click();
                document.getElementById('status-msg').innerText = "SUCCESS!";
            } catch (err) { document.getElementById('status-msg').innerText = "ERROR!"; }
            finally { btn.disabled = false; }
        }

        function bufferToWav(abuffer) {
            let numOfChan = abuffer.numberOfChannels, length = abuffer.length * numOfChan * 2 + 44, buffer = new ArrayBuffer(length), view = new DataView(buffer), pos = 0;
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
            setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
            let channels = []; for (let i = 0; i < numOfChan; i++) channels.push(abuffer.getChannelData(i));
            let offset = 0;
            while (pos < length) {
                for (let i = 0; i < numOfChan; i++) {
                    let sample = Math.max(-1, Math.min(1, channels[i][offset]));
                    view.setInt16(pos, (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0, true); pos += 2;
                }
                offset++;
            }
            return new Blob([buffer], { type: "audio/wav" });
        }

        document.getElementById('user-display').innerText = `ID: ${localStorage.getItem('loggedEmail') || "GUEST"}`;
        function logout() { localStorage.removeItem('loggedEmail'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
