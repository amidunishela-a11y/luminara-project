<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | MEDIA CONVERTER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        
        body {
            margin: 0; background-color: var(--bg); color: #fff;
            font-family: 'Inter', sans-serif; display: flex; height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid rgba(0, 242, 255, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            backdrop-filter: blur(10px);
        }

        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; color: var(--neon); letter-spacing: 4px; margin-bottom: 50px; }

        /* Main Content */
        .content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        
        .converter-container {
            width: 100%; max-width: 800px; background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2); padding: 30px;
            border-radius: 20px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        h2 { font-family: 'Orbitron'; color: var(--neon); text-align: center; margin-bottom: 30px; font-size: 1.2rem; }

        .upload-area {
            border: 2px dashed rgba(0, 242, 255, 0.3); padding: 40px;
            text-align: center; border-radius: 15px; cursor: pointer; transition: 0.3s;
        }
        .upload-area:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }

        video { width: 100%; margin-top: 20px; border-radius: 10px; display: none; border: 1px solid var(--neon); }

        .controls { margin-top: 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; display: none; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-family: 'Orbitron'; font-size: 0.7rem; color: #888; }
        input { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2); 
            color: #fff; padding: 10px; border-radius: 5px; outline: none;
        }

        .action-btn {
            grid-column: span 2; background: var(--neon); color: #000;
            border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .action-btn:hover { background: #fff; transform: scale(1.02); }
        .action-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

        #status { margin-top: 15px; font-size: 0.8rem; color: var(--neon); text-align: center; }

        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <div style="color: var(--neon); font-size: 0.7rem; font-family: 'Orbitron';">AUDIO EXTRACTOR v1.0</div>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="converter-container">
            <h2><i class="fas fa-file-audio"></i> VIDEO TO MP3 CONVERTER</h2>
            
            <div class="upload-area" id="drop-zone" onclick="document.getElementById('video-input').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size: 3rem; color: var(--neon); margin-bottom: 15px;"></i>
                <p>Click or Drag MP4 Video to Start</p>
                <input type="file" id="video-input" accept="video/mp4" hidden>
            </div>

            <video id="video-preview" controls></video>

            <div class="controls" id="controls-ui">
                <div class="input-group">
                    <label>START TIME (Seconds)</label>
                    <input type="number" id="start-time" value="0" min="0">
                </div>
                <div class="input-group">
                    <label>END TIME (Seconds)</label>
                    <input type="number" id="end-time" value="10">
                </div>
                <button class="action-btn" id="convert-btn" onclick="processVideo()">
                    GENERATE & DOWNLOAD MP3
                </button>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js"></script>

    <script>
        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        const controlsUi = document.getElementById('controls-ui');
        const status = document.getElementById('status');
        const startTimeInput = document.getElementById('start-time');
        const endTimeInput = document.getElementById('end-time');

        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                controlsUi.style.display = 'grid';
                
                videoPreview.onloadedmetadata = function() {
                    endTimeInput.value = Math.floor(videoPreview.duration);
                };
            }
        };

        async function processVideo() {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: true });
            
            const file = videoInput.files[0];
            if (!file) return;

            const start = startTimeInput.value;
            const duration = endTimeInput.value - start;

            if (duration <= 0) {
                alert("End time must be greater than Start time");
                return;
            }

            status.innerText = "Initializing Engine...";
            const convertBtn = document.getElementById('convert-btn');
            convertBtn.disabled = true;

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                
                status.innerText = "Processing Audio... Please wait.";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                // FFmpeg command to trim and convert to mp3
                await ffmpeg.run('-ss', start.toString(), '-to', endTimeInput.value.toString(), '-i', 'input.mp4', '-q:a', '0', '-map', 'a', 'output.mp3');

                const data = ffmpeg.FS('readFile', 'output.mp3');
                const audioUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                
                // Trigger Download
                const link = document.createElement('a');
                link.href = audioUrl;
                link.download = `luminara_audio_${Date.now()}.mp3`;
                link.click();

                status.innerText = "✅ Conversion Complete! Downloaded.";
            } catch (err) {
                console.error(err);
                status.innerText = "❌ Error during conversion.";
            } finally {
                convertBtn.disabled = false;
            }
        }

        function logout() {
            localStorage.removeItem('loggedEmail');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
