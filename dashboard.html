<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | AI AUDIO EXTRACTOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        
        body {
            margin: 0; background-color: var(--bg); color: #fff;
            font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px; background: rgba(0, 0, 0, 0.8);
            border-right: 1px solid rgba(0, 242, 255, 0.2);
            display: flex; flex-direction: column; padding: 20px;
            backdrop-filter: blur(10px); z-index: 10;
        }

        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: bold; color: var(--neon); letter-spacing: 4px; margin-bottom: 50px; }

        /* Main Content */
        .content { flex: 1; padding: 30px; overflow-y: auto; position: relative; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }

        /* Media Player Container */
        .player-card {
            width: 100%; max-width: 900px; background: var(--card-bg);
            border: 1px solid rgba(0, 242, 255, 0.2); padding: 20px;
            border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
        }

        #video-preview { width: 100%; border-radius: 10px; border: 1px solid #222; background: #000; display: none; }

        .upload-placeholder {
            height: 300px; border: 2px dashed rgba(0, 242, 255, 0.3);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; border-radius: 10px; transition: 0.3s;
        }
        .upload-placeholder:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }

        /* Controls */
        .tools-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px;
            padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; display: none;
        }

        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .input-box input { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2);
            color: #fff; padding: 12px; border-radius: 5px; outline: none; font-family: 'Orbitron';
        }

        .convert-btn {
            grid-column: span 2; background: var(--neon); color: #000;
            border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron';
            font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .convert-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }
        .convert-btn:disabled { background: #444; cursor: not-allowed; box-shadow: none; }

        #status-msg { grid-column: span 2; text-align: center; font-size: 0.8rem; color: var(--neon); margin-top: 10px; }

        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <div style="color: #444; font-size: 0.6rem; letter-spacing: 2px; margin-bottom: 20px;">CORE V2.0</div>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="header">
            <h2 style="font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon);">AUDIO EXTRACTION UNIT</h2>
            <div id="user-display" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888;">ID: GUEST</div>
        </div>

        <div class="player-card">
            <input type="file" id="video-input" accept="video/mp4" style="display: none;">
            
            <div class="upload-placeholder" id="drop-zone" onclick="document.getElementById('video-input').click()">
                <i class="fas fa-file-video" style="font-size: 3rem; color: var(--neon); margin-bottom: 15px;"></i>
                <p style="font-family: 'Orbitron'; font-size: 0.8rem;">UPLOAD MP4 VIDEO DATA</p>
            </div>

            <video id="video-preview" controls></video>

            <div class="tools-grid" id="tools-ui">
                <div class="input-box">
                    <label><i class="fas fa-step-backward"></i> START POINT (SEC)</label>
                    <input type="number" id="start-time" value="0" min="0" step="0.1">
                </div>
                <div class="input-box">
                    <label><i class="fas fa-step-forward"></i> END POINT (SEC)</label>
                    <input type="number" id="end-time" value="10" step="0.1">
                </div>
                <button class="convert-btn" id="convert-btn" onclick="extractAudio()">
                    PROCESS & DOWNLOAD MP3
                </button>
                <div id="status-msg">READY FOR COMMAND...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js"></script>

    <script>
        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const toolsUi = document.getElementById('tools-ui');
        const statusMsg = document.getElementById('status-msg');
        const dropZone = document.getElementById('drop-zone');

        // Handle File Selection
        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                videoPreview.src = url;
                videoPreview.style.display = 'block';
                dropZone.style.display = 'none';
                toolsUi.style.display = 'grid';
                
                videoPreview.onloadedmetadata = () => {
                    document.getElementById('end-time').value = videoPreview.duration.toFixed(1);
                };
            }
        };

        // Core Extraction Function
        async function extractAudio() {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: false });
            
            const file = videoInput.files[0];
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            const btn = document.getElementById('convert-btn');

            if (!file) return;
            
            btn.disabled = true;
            statusMsg.innerText = "INITIALIZING CORE ENGINE...";

            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                
                statusMsg.innerText = "EXTRACTING AUDIO DATA... PLEASE WAIT";
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

                // Command to trim and convert to MP3
                // -ss (start), -to (end), -i (input), -q:a (quality), -map a (audio only)
                await ffmpeg.run('-ss', start, '-to', end, '-i', 'input.mp4', '-q:a', '2', '-map', 'a', 'output.mp3');

                const data = ffmpeg.FS('readFile', 'output.mp3');
                const audioUrl = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                
                // Automatic Download
                const link = document.createElement('a');
                link.href = audioUrl;
                link.download = `LUMINARA_EXTRACT_${Date.now()}.mp3`;
                link.click();

                statusMsg.innerText = "COMMAND EXECUTED SUCCESSFULLY. FILE SAVED.";
            } catch (err) {
                statusMsg.innerText = "ERROR: TRANSCODING FAILED.";
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }

        // Auth Display
        const userEmail = localStorage.getItem('loggedEmail') || "UNAUTHORIZED_USER";
        document.getElementById('user-display').innerText = `ID: ${userEmail}`;

        function logout() {
            localStorage.removeItem('loggedEmail');
            window.location.href = 'index.html';
        }

        // Security - Disable right click
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
