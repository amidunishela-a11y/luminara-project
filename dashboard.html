<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINARA | AI MEDIA HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon: #00f2ff; --bg: #000a0f; --card-bg: rgba(0, 242, 255, 0.05); }
        body { margin: 0; background-color: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: rgba(0, 0, 0, 0.9); border-right: 1px solid rgba(0, 242, 255, 0.2); display: flex; flex-direction: column; padding: 20px; backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: bold; color: var(--neon); letter-spacing: 4px; margin-bottom: 40px; }
        .nav-btn { background: none; border: 1px solid rgba(0, 242, 255, 0.1); color: #888; padding: 12px; margin-bottom: 10px; border-radius: 5px; cursor: pointer; text-align: left; font-family: 'Orbitron'; font-size: 0.7rem; transition: 0.3s; }
        .nav-btn.active, .nav-btn:hover { background: rgba(0, 242, 255, 0.1); color: var(--neon); border-color: var(--neon); }

        /* Main Content */
        .content { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; }

        /* Panels */
        .main-panel { width: 100%; max-width: 900px; display: none; }
        .main-panel.active { display: block; }

        .player-card { background: var(--card-bg); border: 1px solid rgba(0, 242, 255, 0.2); padding: 25px; border-radius: 15px; box-shadow: 0 0 30px rgba(0, 242, 255, 0.1); }
        #video-preview { width: 100%; border-radius: 10px; border: 1px solid #222; background: #000; margin-bottom: 15px; display: none; }

        .upload-placeholder { height: 250px; border: 2px dashed rgba(0, 242, 255, 0.3); display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; border-radius: 10px; transition: 0.3s; }
        .upload-placeholder:hover { background: rgba(0, 242, 255, 0.05); border-color: var(--neon); }

        /* Tools */
        .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 25px; padding: 20px; background: rgba(0,0,0,0.3); border-radius: 10px; }
        .input-box { display: flex; flex-direction: column; gap: 8px; }
        .input-box label { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--neon); }
        .input-box input { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 242, 255, 0.2); color: #fff; padding: 12px; border-radius: 5px; outline: none; font-family: 'Orbitron'; }

        .action-btn { grid-column: span 2; background: var(--neon); color: #000; border: none; padding: 15px; border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        .action-btn:hover { background: #fff; box-shadow: 0 0 20px var(--neon); }

        /* YT Panel Specific */
        .yt-input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .yt-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--neon); padding: 15px; border-radius: 5px; color: #fff; font-family: 'Inter'; outline: none; }
        .format-select { background: #000; color: var(--neon); border: 1px solid var(--neon); padding: 10px; border-radius: 5px; font-family: 'Orbitron'; }

        .terminate-btn { margin-top: auto; padding: 15px; background: transparent; border: 1px solid #ff4d4d; color: #ff4d4d; border-radius: 8px; cursor: pointer; font-family: 'Orbitron'; transition: 0.3s; }
        .terminate-btn:hover { background: #ff4d4d; color: #fff; }

        #status-msg, #yt-status { text-align: center; font-size: 0.8rem; color: var(--neon); margin-top: 15px; font-family: 'Orbitron'; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">LUMINARA</div>
        <button class="nav-btn active" onclick="switchTab('extractor', this)"><i class="fas fa-cut"></i> LOCAL EXTRACTOR</button>
        <button class="nav-btn" onclick="switchTab('youtube', this)"><i class="fab fa-youtube"></i> YT DOWNLOADER</button>
        <button class="terminate-btn" onclick="logout()">TERMINATE</button>
    </div>

    <div class="content">
        <div class="header">
            <h2 id="panel-title" style="font-family: 'Orbitron'; font-size: 1rem; color: var(--neon);">LOCAL EXTRACTION UNIT</h2>
            <div id="user-display" style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888;">ID: GUEST</div>
        </div>

        <div id="extractor" class="main-panel active">
            <div class="player-card">
                <input type="file" id="video-input" accept="video/mp4" style="display: none;">
                <div class="upload-placeholder" id="drop-zone" onclick="document.getElementById('video-input').click()">
                    <i class="fas fa-file-video" style="font-size: 2.5rem; color: var(--neon); margin-bottom: 10px;"></i>
                    <p style="font-size: 0.8rem;">UPLOAD MP4 VIDEO DATA</p>
                </div>
                <video id="video-preview" controls></video>
                <div class="tools-grid" id="tools-ui" style="display: none;">
                    <div class="input-box">
                        <label>START POINT (SEC)</label>
                        <input type="number" id="start-time" value="0" step="0.1">
                    </div>
                    <div class="input-box">
                        <label>END POINT (SEC)</label>
                        <input type="number" id="end-time" value="10" step="0.1">
                    </div>
                    <button class="action-btn" id="convert-btn" onclick="extractAudio()">EXTRACT & DOWNLOAD MP3</button>
                    <div id="status-msg">READY FOR COMMAND...</div>
                </div>
            </div>
        </div>

        <div id="youtube" class="main-panel">
            <div class="player-card">
                <p style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888; margin-bottom: 20px;">ENTER YOUTUBE URL FOR CLOUD EXTRACTION</p>
                <div class="yt-input-group">
                    <input type="text" id="yt-url" class="yt-input" placeholder="https://www.youtube.com/watch?v=...">
                    <select id="yt-format" class="format-select">
                        <option value="mp3">MP3 (Audio)</option>
                        <option value="mp4">MP4 (Video)</option>
                    </select>
                </div>
                <button class="action-btn" onclick="downloadYoutube()">GENERATE DOWNLOAD LINK</button>
                <div id="yt-status">AWAITING LINK...</div>
                <div id="yt-result" style="margin-top: 20px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ffmpeg/0.11.6/ffmpeg.min.js"></script>
    <script>
        // Tab Switching Logic
        function switchTab(tabId, btn) {
            document.querySelectorAll('.main-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            document.getElementById('panel-title').innerText = tabId === 'extractor' ? 'LOCAL EXTRACTION UNIT' : 'YT CLOUD DOWNLOADER';
        }

        // --- Local Extractor Logic ---
        const videoInput = document.getElementById('video-input');
        const videoPreview = document.getElementById('video-preview');
        videoInput.onchange = function(e) {
            const file = e.target.files[0];
            if (file) {
                videoPreview.src = URL.createObjectURL(file);
                videoPreview.style.display = 'block';
                document.getElementById('drop-zone').style.display = 'none';
                document.getElementById('tools-ui').style.display = 'grid';
                videoPreview.onloadedmetadata = () => { document.getElementById('end-time').value = videoPreview.duration.toFixed(1); };
            }
        };

        async function extractAudio() {
            const { createFFmpeg, fetchFile } = FFmpeg;
            const ffmpeg = createFFmpeg({ log: false });
            const file = videoInput.files[0];
            const start = document.getElementById('start-time').value;
            const end = document.getElementById('end-time').value;
            if (!file) return;
            document.getElementById('status-msg').innerText = "INITIALIZING ENGINE...";
            try {
                if (!ffmpeg.isLoaded()) await ffmpeg.load();
                ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
                await ffmpeg.run('-ss', start, '-to', end, '-i', 'input.mp4', '-q:a', '2', '-map', 'a', 'output.mp3');
                const data = ffmpeg.FS('readFile', 'output.mp3');
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([data.buffer], { type: 'audio/mp3' }));
                link.download = `LUMINARA_EXTRACT_${Date.now()}.mp3`;
                link.click();
                document.getElementById('status-msg').innerText = "SUCCESSFULLY EXTRACTED.";
            } catch (e) { document.getElementById('status-msg').innerText = "PROCESS FAILED."; }
        }

        // --- YouTube Downloader Logic ---
        function downloadYoutube() {
            const url = document.getElementById('yt-url').value;
            const format = document.getElementById('yt-format').value;
            const status = document.getElementById('yt-status');
            const resultDiv = document.getElementById('yt-result');

            if (!url.includes("youtube.com") && !url.includes("youtu.be")) {
                status.innerText = "INVALID YOUTUBE URL.";
                return;
            }

            status.innerText = "REDIRECTING TO SECURE DOWNLOAD SERVER...";
            
            // YouTube downloader සේවාවක් වෙත Link එක යොමු කිරීම (Direct API restriction නිසා)
            // මෙමගින් පරිශීලකයාට පහසුවෙන් File එක ලබාගත හැක.
            const apiURL = `https://p.oceansaver.in/api/download.php?url=${encodeURIComponent(url)}&format=${format}`;
            
            status.innerHTML = `PROCESSING COMPLETE. <br><br> <a href="${apiURL}" target="_blank" style="color:var(--neon); text-decoration:none; border:1px solid var(--neon); padding:10px; border-radius:5px;">CLICK HERE TO DOWNLOAD ${format.toUpperCase()}</a>`;
        }

        // User & Security
        document.getElementById('user-display').innerText = `ID: ${localStorage.getItem('loggedEmail') || "GUEST"}`;
        function logout() { localStorage.removeItem('loggedEmail'); window.location.href = 'index.html'; }
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
