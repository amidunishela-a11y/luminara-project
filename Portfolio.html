<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Poll</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        /* Portfolio Button */
        .btn-portfolio {
            padding: 15px 30px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            color: white;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        /* Overlay Background (Full Screen Blur) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px); /* Meeka thama background eka blur karanne */
            display: none; 
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        /* Glass Poll Card */
        .poll-card {
            background: rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 320px;
            color: white;
            text-align: center;
        }

        .poll-option {
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.2s;
        }

        .poll-option:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .close-btn {
            margin-top: 15px;
            font-size: 14px;
            color: #ddd;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <button class="btn-portfolio" onclick="togglePoll(true)">Open Portfolio Poll</button>

    <div class="overlay" id="pollOverlay">
        <div class="poll-card">
            <h3>Do you like my work?</h3>
            <div class="poll-option" onclick="vote('Yes')">🔥 Yes, Awesome!</div>
            <div class="poll-option" onclick="vote('Good')">✨ It's Good</div>
            <div class="poll-option" onclick="vote('Improve')">🛠️ Needs Work</div>
            
            <div class="close-btn" onclick="togglePoll(false)">Close</div>
        </div>
    </div>

    <script>
        function togglePoll(show) {
            const overlay = document.getElementById('pollOverlay');
            overlay.style.display = show ? 'flex' : 'none';
        }

        function vote(option) {
            alert("Thanks for voting: " + option);
            togglePoll(false);
        }
    </script>

</body>
</html>
