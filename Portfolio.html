<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Innovations | Neon Nano Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-orange: #ff6a00;
            --neon-glow: #ffae00;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a12; /* Darker background for neon to pop */
            background-image: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%);
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- Custom Header --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
            position: relative;
        }

        .logo-main { font-weight: 800; font-size: 24px; letter-spacing: 2px; color: #fff; }
        .logo-main span { color: var(--neon-orange); }

        nav { background: var(--glass); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 40px; padding: 5px 15px; }
        nav ul { display: flex; list-style: none; gap: 15px; }
        nav ul li a { text-decoration: none; color: white; font-size: 11px; opacity: 0.7; text-transform: uppercase; transition: 0.3s; }
        nav ul li a:hover { opacity: 1; color: var(--neon-orange); }

        /* --- Hero Section --- */
        .hero {
            display: flex;
            padding: 40px 8%;
            min-height: 85vh;
            align-items: center;
            flex-wrap: wrap;
        }

        .hero-text {
            flex: 1;
            min-width: 320px;
            z-index: 10;
        }

        .hero-text h1 {
            font-size: clamp(30px, 5vw, 50px);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero-text h1 span {
            color: var(--neon-orange);
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.5);
        }

        .typing-container {
            font-size: 15px;
            line-height: 1.6;
            min-height: 80px;
            margin-bottom: 30px;
            color: #ccc;
        }

        /* --- Nano Visuals (The Sphere) --- */
        .hero-visual {
            flex: 1;
            min-width: 300px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The glass panel with subtle etchings */
        .glass-panel {
            position: absolute;
            width: 100%;
            max-width: 400px;
            height: 400px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            backdrop-filter: blur(5px);
            mask-image: radial-gradient(circle, black 40%, transparent 80%);
        }

        /* The Animated Sphere */
        .sphere-container {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateSphere 20s linear infinite;
        }

        @keyframes rotateSphere {
            from { transform: rotateY(0deg) rotateX(0deg); }
            to { transform: rotateY(360deg) rotateX(360deg); }
        }

        /* Creating the "Nano-Particle" Sphere look */
        .nano-core {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, var(--neon-orange) 0%, transparent 70%);
            filter: blur(20px);
            opacity: 0.4;
        }

        .particle-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed var(--neon-orange);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-orange);
            opacity: 0.3;
        }

        /* Tiny floating neon dots */
        .dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-glow);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-orange), 0 0 20px var(--neon-orange);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-15px) scale(1.2); opacity: 1; }
        }

        /* --- Social Cards --- */
        .social-section {
            padding: 60px 8%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .social-card {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: 0.4s;
            opacity: 0;
            transform: translateY(20px);
        }

        .social-card.show { opacity: 1; transform: translateY(0); }
        
        .social-card:hover {
            border-color: var(--neon-orange);
            background: rgba(255, 106, 0, 0.05);
            transform: scale(1.02);
        }

        .icon-neon {
            width: 35px;
            height: 35px;
            border: 1px solid var(--neon-orange);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--neon-orange);
            font-weight: bold;
            box-shadow: inset 0 0 5px var(--neon-orange);
        }

        .social-name h4 { font-size: 17px; letter-spacing: 1px; }
        .social-name p { font-size: 11px; opacity: 0.5; }

        /* --- Responsive Tweaks --- */
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; padding-top: 20px; }
            .hero-visual { height: 300px; margin-top: 20px; }
            .glass-panel { max-width: 280px; height: 280px; }
            .sphere-container { width: 150px; height: 150px; }
            header { flex-direction: column; gap: 15px; }
            nav ul { gap: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-main">NIRMANA <span>INNOVATIONS</span></div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#social">Social</a></li>
                <li><a href="#">Connect</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero">
        <div class="hero-text">
            <h1>CRAFTING THE<br><span>NANO FUTURE</span></h1>
            <div class="typing-container" id="typewriter"></div>
            <a href="#social" style="background: var(--neon-orange); color: black; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: 800; font-size: 13px;">CONNECT NOW</a>
        </div>

        <div class="hero-visual">
            <div class="glass-panel"></div>
            <div class="sphere-container" id="sphere">
                <div class="nano-core"></div>
                </div>
        </div>
    </main>

    <section class="social-section" id="social">
        <a href="#" class="social-card">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="icon-neon">YT</div>
                <div class="social-name">
                    <h4>YOUTUBE</h4>
                    <p>4K Nano Animation Tutorials</p>
                </div>
            </div>
            <div style="color: var(--neon-orange);">→</div>
        </a>

        <a href="#" class="social-card">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="icon-neon">IG</div>
                <div class="social-name">
                    <h4>INSTAGRAM</h4>
                    <p>Daily 3D Visual Renders</p>
                </div>
            </div>
            <div style="color: var(--neon-orange);">→</div>
        </a>

        <a href="#" class="social-card">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="icon-neon">X</div>
                <div class="social-name">
                    <h4>TWITTER / X</h4>
                    <p>Tech & Innovation News</p>
                </div>
            </div>
            <div style="color: var(--neon-orange);">→</div>
        </a>
    </section>

    <script>
        // --- 1. Generate Nano Particles for the Sphere ---
        const sphere = document.getElementById('sphere');
        const particleCount = 40;

        for (let i = 0; i < particleCount; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot';
            
            // Randomly position in 3D sphere
            const u = Math.random();
            const v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            const r = 90; // radius

            const x = r * Math.sin(phi) * Math.cos(theta) + 100;
            const y = r * Math.sin(phi) * Math.sin(theta) + 100;
            const z = r * Math.cos(phi);

            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;
            dot.style.transform = `translateZ(${z}px)`;
            dot.style.animationDelay = `${Math.random() * 2}s`;
            
            sphere.appendChild(dot);
        }

        // --- 2. Typewriter Effect ---
        const text = "Welcome to the realm of Nirmana Innovations. We specialize in molecular-level 3D design and neon-infused digital aesthetics. Join our journey as we build the next generation of visual experiences.";
        let index = 0;
        function type() {
            if (index < text.length) {
                document.getElementById('typewriter').innerHTML += text.charAt(index);
                index++;
                setTimeout(type, 40);
            }
        }
        window.onload = type;

        // --- 3. Scroll Reveal for Social Cards ---
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, idx) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('show');
                    }, idx * 150);
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.social-card').forEach(card => observer.observe(card));
    </script>
</body>
</html>
