<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WADANA.LK | වදන.LK</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Poppins:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FF7043;
            --deep-blue: #1A305E; /* රූපයේ ඇති තද නිල් පැහැය */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Noto Sans Sinhala', 'Poppins', sans-serif;
            background: #000b18;
            color: white;
            overflow-x: hidden;
        }

        /* --- ✨ UPDATED CUSTOM W LOGO STYLE ✨ --- */
        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .w-icon-wrapper {
            position: relative;
            width: 55px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
        }

        /* රූපයේ ඇති W අකුරේ හැඩය නිර්මාණය කිරීම */
        .w-custom {
            font-family: 'Poppins', sans-serif;
            font-size: 58px;
            font-weight: 900;
            position: relative;
            line-height: 1;
            /* Gradient එක භාවිතා කර වර්ණ දෙක ලබා ගැනීම */
            background: linear-gradient(135deg, var(--deep-blue) 50%, var(--primary-orange) 50%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
            transform: skewX(-5deg); /* තරමක් ඇලවූ ස්වභාවය */
        }

        /* රූපයේ ඇති කුඩා උද්ධෘත ලකුණු (Quotes) වැනි කොටස */
        .w-icon-wrapper::after {
            content: '”';
            position: absolute;
            top: 2px;
            right: -2px;
            color: var(--primary-orange);
            font-size: 25px;
            font-weight: 900;
        }

        .brand-text {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        /* --- අතුරුමුහුණතේ ඉතිරි කොටස් --- */
        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1300px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 10px 30px;
            z-index: 1000;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-container {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
            margin: 0 20px;
        }

        .search-container input {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px 10px 45px;
            border-radius: 15px;
            color: white;
            outline: none;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li { margin-left: 20px; }
        nav ul li a { text-decoration: none; color: #ccc; font-size: 15px; }

        .hero-card {
            margin-top: 150px;
            text-align: center;
            padding: 100px 20px;
            background: radial-gradient(circle at center, rgba(255,112,67,0.05), transparent);
        }

        h1 { font-size: 3.5rem; margin-bottom: 20px; }
        .btn {
            background: var(--primary-orange);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <div class="w-icon-wrapper">
                    <span class="w-custom">W</span>
                </div>
                <div class="brand-text">ADANA.LK</div>
            </a>

            <div class="search-container">
                <input type="text" placeholder="සොයන්න...">
            </div>

            <ul>
                <li><a href="#">මුල් පිටුව</a></li>
                <li><a href="#">සේවා</a></li>
                <li><a href="#">අප ගැන</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-card">
        <h1>අපි ලස්සන වෙබ් අඩවි නිර්මාණය කරමු</h1>
        <p>ඔබේ සිහිනය සැබෑ කරන නවීන වෙබ් නිර්මාණ කලාව.</p>
        <button class="btn">අප හා සම්බන්ධ වන්න</button>
    </section>

</body>
</html>
