<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WADANA.LK | 3D වදන</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Poppins:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-orange: #FF7043;
            --deep-blue: #1A305E;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans Sinhala', 'Poppins', sans-serif;
            background: #000b18;
            color: white;
            overflow: hidden; /* Canvas එක නිසා scrollbar ඉවත් කරන ලදී */
        }

        /* Canvas Background */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        header {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1300px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            padding: 10px 30px;
            z-index: 1000;
        }

        nav { display: flex; justify-content: space-between; align-items: center; }

        .logo { display: flex; align-items: center; text-decoration: none; }

        /* Logo එකේ මැද අකුර Canvas එකට සමාන වර්ණ ගැන්වීම */
        .w-logo-3d {
            font-family: 'Poppins', sans-serif;
            font-size: 45px;
            font-weight: 900;
            margin-right: 10px;
            background: linear-gradient(135deg, #fff, var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { filter: drop-shadow(0 0 2px var(--primary-orange)); }
            to { filter: drop-shadow(0 0 10px var(--primary-orange)); }
        }

        .brand-text { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 1px; }

        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { text-decoration: none; color: #ccc; font-size: 15px; transition: 0.3s; }
        nav ul li a:hover { color: var(--primary-orange); }

        .hero-content {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none; /* 3D එකට බාධා නොවීමට */
        }

        h1 { font-size: 3.5rem; margin-bottom: 20px; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        p { font-size: 1.2rem; opacity: 0.8; max-width: 600px; }

        .btn {
            background: var(--primary-orange);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            pointer-events: auto;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--primary-orange); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <header>
        <nav>
            <a href="#" class="logo">
                <span class="w-logo-3d">W</span>
                <div class="brand-text">ADANA.LK</div>
            </a>
            <ul>
                <li><a href="#">මුල් පිටුව</a></li>
                <li><a href="#">සේවා</a></li>
                <li><a href="#">අප ගැන</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero-content">
        <h1>අනාගතයේ වෙබ් අඩවි අදම නිර්මාණය කරමු</h1>
        <p>අපි ඔබේ ව්‍යාපාරයට නවීනතම 3D තාක්ෂණය සහ කලාත්මක නිර්මාණශීලීත්වය මුසු කරමු.</p>
        <button class="btn">අප හා සම්බන්ධ වන්න</button>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, particles, orb;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 1. ගෝලය (The Orb)
            const orbGeometry = new THREE.IcosahedronGeometry(1.5, 2);
            const orbMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xFF7043, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.2 
            });
            orb = new THREE.Mesh(orbGeometry, orbMaterial);
            scene.add(orb);

            // 2. නැැනෝ අංශු (Nano Particles)
            const partGeometry = new THREE.BufferGeometry();
            const partCount = 1500;
            const posArray = new Float32Array(partCount * 3);

            for(let i = 0; i < partCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 10;
            }

            partGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const partMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0xFF7043,
                transparent: true,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(partGeometry, partMaterial);
            scene.add(particles);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            orb.rotation.y += 0.005;
            orb.rotation.x += 0.002;

            particles.rotation.y += 0.001;
            
            // අංශු චලනය වන ස්වභාවය
            const positions = particles.geometry.attributes.position.array;
            for(let i = 0; i < positions.length; i += 3) {
                positions[i+1] += Math.sin(Date.now() * 0.001 + positions[i]) * 0.002;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        init();
    </script>
</body>
</html>
