<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Innovations | 3D Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --accent-orange: #ff9a8b;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
            height: 100vh;
        }
        /* --- NIRMANA Animation & Glow --- */
.logo-main {
    animation: glowText 3s ease-in-out infinite alternate;
    cursor: pointer;
}

@keyframes glowText {
    0% {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #6e8efb, 0 0 20px #6e8efb;
        color: #ffffff;
    }
    50% {
        text-shadow: 0 0 10px #fff, 0 0 20px #a777e3, 0 0 30px #a777e3, 0 0 40px #a777e3;
        color: #f0f0f0;
    }
    100% {
        text-shadow: 0 0 5px #fff, 0 0 10px #00d2ff, 0 0 15px #00d2ff, 0 0 20px #00d2ff;
        color: #ffffff;
    }
}

        /* --- Background Animation --- */
        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('—Pngtree—floating islands in a dreamy_15844341.png') center/cover; /* පින්තූරයේ ඇති වලාකුළු සහිත පසුබිම වැනි එකක් */
        }

        /* --- Header / Navbar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo-main { font-weight: 800; font-size: 24px; letter-spacing: 1px; }
        .logo-sub { font-size: 14px; color: var(--accent-orange); font-weight: 600; }

        nav {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 5px 30px;
        }

        nav ul { display: flex; list-style: none; align-items: center; }
        nav ul li { margin: 0 15px; }
        nav ul li a { 
            text-decoration: none; 
            color: white; 
            font-size: 14px; 
            opacity: 0.8; 
            transition: 0.3s;
            text-transform: capitalize;
        }
        nav ul li a.active { 
            background: var(--primary-gradient);
            padding: 8px 20px;
            border-radius: 20px;
            opacity: 1;
        }

        /* --- Left Side Icons --- */
        .side-icons {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 20px 10px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
        }

        .icon-dot { width: 35px; height: 35px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .icon-dot:hover { background: var(--primary-gradient); }

        /* --- Main Content --- */
        .container {
            display: flex;
            padding: 0 8%;
            height: calc(100vh - 100px);
            align-items: center;
        }

        .hero-text { flex: 1; }
        .hero-text h1 { 
            font-size: 55px; 
            font-weight: 800; 
            line-height: 1.1;
            background: linear-gradient(to right, #fff, #c3dafe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .hero-text span { color: #ffbc00; -webkit-text-fill-color: #ffbc00; } /* Animation text color */
        
        .hero-text p { font-size: 18px; opacity: 0.9; margin-bottom: 40px; max-width: 450px; }

        /* --- Floating Island Image --- */
        .hero-image {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: flex-end;
        }

        .floating-island {
            width: 100%;
            max-width: 600px;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* --- Project Cards --- */
        .project-cards {
            position: absolute;
            bottom: 40px;
            left: 8%;
            display: flex;
            gap: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px;
            width: 180px;
            transition: 0.3s;
        }

        .card img { width: 100%; border-radius: 15px; margin-bottom: 8px; }
        .card p { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        .card h4 { font-size: 12px; }

        .btn-portfolio {
            background: var(--primary-gradient);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <header>
        <div class="logo-container">
            <span class="logo-main">Nirmana</span>
            <span class="logo-sub">Innovations</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Story</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="side-icons">
        <div class="icon-dot">🏠</div>
        <div class="icon-dot">📁</div>
        <div class="icon-dot">❤️</div>
        <div class="icon-dot">⚙️</div>
        <div class="icon-dot">👤</div>
    </div>

    <main class="container">
        <div class="hero-text">
            <h1>CREATE THE FUTURE<br>WITH <span>3D ANIMATION</span></h1>
            <p>Unleash Your Imagination through Stunning 3D Worlds & Characters.</p>
            <button class="btn-portfolio">EXPLORE OUR PORTFOLIO</button>
        </div>

        <div class="hero-image">
            <img src="" onerror="this.src='https://cdn.pixabay.com/photo/2021/08/30/21/30/fantasy-6587180_1280.png'">
        </div>
    </main>

    <div class="project-cards">
        <div class="card">
            <img src="https://via.placeholder.com/150/4444dd/ffffff?text=Robot" alt="Project">
            <p>Project</p>
            <h4>ROBOT GUARDIAN</h4>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/150/dd4444/ffffff?text=Dragon" alt="Project">
            <p>Project</p>
            <h4>MYTHIC LANDS</h4>
        </div>
        <div class="card">
            <img src="https://via.placeholder.com/150/44dd44/ffffff?text=City" alt="Project">
            <p>Project</p>
            <h4>SKYLINE 2042</h4>
        </div>
    </div>

</body>
</html>
