<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nirmana Innovations | 3D Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6e8efb, #a777e3);
            --accent-orange: #ff9a8b;
            --glass: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glow-color: #6e8efb;
            --neo-blue: #00f2ff; /* Neo line color */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1a2a6c, #b21f1f, #fdbb2d);
            background-attachment: fixed;
            color: white;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: url('—Pngtree—floating islands in a dreamy_15844341.png') center/cover;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            z-index: 1000;
            position: relative;
        }

        .logo-container { 
            display: flex; 
            flex-direction: column; 
            position: relative; 
        }

        .logo-main { 
            font-weight: 800; 
            font-size: 28px; 
            letter-spacing: 2px; 
            color: #fff;
            text-transform: uppercase;
            display: flex;
            position: relative;
        }

        .logo-main span {
            display: inline-block;
            animation: scatter-glow 6s infinite ease-in-out;
        }

        /* Explosion Delays */
        .logo-main span:nth-child(1) { animation-delay: 0s; --x: -15; --y: -10; }
        .logo-main span:nth-child(2) { animation-delay: 0.1s; --x: -5; --y: -20; }
        .logo-main span:nth-child(3) { animation-delay: 0.2s; --x: 10; --y: -15; }
        .logo-main span:nth-child(4) { animation-delay: 0.3s; --x: 15; --y: 10; }
        .logo-main span:nth-child(5) { animation-delay: 0.4s; --x: -10; --y: 15; }
        .logo-main span:nth-child(6) { animation-delay: 0.5s; --x: 5; --y: 20; }
        .logo-main span:nth-child(7) { animation-delay: 0.6s; --x: 20; --y: 0; }

        @keyframes scatter-glow {
            0%, 70%, 100% { 
                transform: translate(0, 0) scale(1);
                text-shadow: 0 0 10px #fff, 0 0 20px var(--glow-color);
                opacity: 1;
            }
            80% { 
                transform: translate(calc(var(--x, 0) * 1px), calc(var(--y, 0) * 1px)) rotate(20deg);
                opacity: 0.5;
                filter: blur(2px);
            }
            85% {
                transform: translate(0, 0) scale(1.1);
                text-shadow: 0 0 20px #fff, 0 0 40px #a777e3, 0 0 60px #a777e3;
                opacity: 1;
                filter: blur(0);
            }
        }

        /* --- Updated Orbiting Stars with Neo Line --- */
        .star-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            border-radius: 50%;
            /* This creates the faint 'Neo Line' path */
            border: 1px solid rgba(0, 242, 255, 0.15);
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .star {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neo-blue);
            animation: orbit 3s linear infinite;
        }

        /* Multiple stars to create a trail */
        .star:nth-child(2) { animation-delay: -0.2s; opacity: 0.7; width: 4px; height: 4px; }
        .star:nth-child(3) { animation-delay: -0.4s; opacity: 0.4; width: 3px; height: 3px; }
        .star:nth-child(4) { animation-delay: -0.6s; opacity: 0.2; width: 2px; height: 2px; }

        @keyframes orbit {
            from { transform: rotate(0deg) translateX(75px) rotate(0deg); }
            to { transform: rotate(360deg) translateX(75px) rotate(-360deg); }
        }

        .logo-sub { font-size: 14px; color: var(--accent-orange); font-weight: 600; letter-spacing: 1px; }

        nav {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 5px 20px;
        }

        nav ul { display: flex; list-style: none; align-items: center; }
        nav ul li { margin: 0 10px; }
        nav ul li a { 
            text-decoration: none; 
            color: white; 
            font-size: 13px; 
            opacity: 0.8; 
            transition: 0.3s;
            text-transform: capitalize;
        }
        nav ul li a.active { 
            background: var(--primary-gradient);
            padding: 6px 15px;
            border-radius: 20px;
            opacity: 1;
        }

        .side-icons {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 15px 8px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            z-index: 100;
        }

        .icon-dot { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; }
        .icon-dot:hover { background: var(--primary-gradient); }

        .container {
            display: flex;
            padding: 0 8%;
            min-height: calc(100vh - 100px);
            align-items: center;
            flex-wrap: wrap; 
        }

        .hero-text { flex: 1; min-width: 300px; padding-top: 50px; }
        .hero-text h1 { 
            font-size: clamp(32px, 5vw, 55px); 
            font-weight: 800; 
            line-height: 1.1;
            background: linear-gradient(to right, #fff, #c3dafe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .hero-text span { color: #ffbc00; -webkit-text-fill-color: #ffbc00; }
        .hero-text p { font-size: 16px; opacity: 0.9; margin-bottom: 30px; max-width: 450px; }

        .hero-image {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .floating-island {
            width: 100%;
            max-width: 500px;
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .project-cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px 8%;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 10px;
            width: 180px;
            transition: 0.3s;
        }

        .card img { width: 100%; border-radius: 15px; margin-bottom: 8px; }
        .card p { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        .card h4 { font-size: 12px; }

        .btn-portfolio {
            background: var(--primary-gradient);
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        /* --- Mobile Responsive Rules --- */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; padding: 15px; }
            nav { padding: 5px 10px; }
            nav ul li { margin: 0 5px; }
            nav ul li a { font-size: 11px; }
            .side-icons { display: none; } 
            .container { flex-direction: column; text-align: center; padding-top: 20px; }
            .hero-text { padding-top: 0; order: 1; }
            .hero-image { order: 2; margin-top: 30px; }
            .project-cards { position: static; margin-top: 20px; }
            .card { width: 45%; } 
        }

        @media (max-width: 480px) {
            .card { width: 100%; } 
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <header>
        <div class="logo-container">
            <div class="star-orbit">
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
                <div class="star"></div>
            </div>
            
            <div class="logo-main">
                <span>N</span><span>i</span><span>r</span><span>m</span><span>a</span><span>n</span><span>a</span>
            </div>
            <span class="logo-sub">Innovations</span>
        </div>
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="side-icons">
        <div class="icon-dot">🏠</div>
        <div class="icon-dot">📁</div>
        <div class="icon-dot">❤️</div>
        <div class="icon-dot">⚙️</div>
    </div>

    <main class="container">
        <div class="hero-text">
            <h1>CREATE THE FUTURE<br>WITH <span>3D ANIMATION</span></h1>
            <p>Unleash Your Imagination through Stunning 3D Worlds & Characters.</p>
            <button class="btn-portfolio">EXPLORE OUR PORTFOLIO</button>
        </div>

        <div class="hero-image">
            <img class="card floating-island" src="Gemini_Generated_Image_7oic907oic907oic.png" alt="Island">
        </div>
    </main>

    <div class="project-cards">
        <div class="card">
            <img src="Gemini_Generated_Image_qmlm9aqmlm9aqmlm.png" alt="Project">
            <p>Project</p>
            <h4>ROBOT GUARDIAN</h4>
        </div>
        <div class="card">
            <img src="Gemini_Generated_Image_h31jg6h31jg6h31j.png" alt="Project">
            <p>Project</p>
            <h4>MYTHIC LANDS</h4>
        </div>
        <div class="card">
            <img src="Gemini_Generated_Image_mnmsd1mnmsd1mnms.png" alt="Project">
            <p>Project</p>
            <h4>SKYLINE 2042</h4>
        </div>
    </div>

</body>
</html>
