<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WADANA.LK | වදන.LK</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Sinhala', 'Poppins', sans-serif;
            /* iOS 26 style background gradient */
            background: linear-gradient(135deg, #001529 0%, #003366 100%);
            color: white;
            min-height: 100vh;
        }

        /* --- Glassmorphism Header --- */
        header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1200px;
            /* Glass Effect */
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px 30px;
            z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .w-icon-container {
            background: linear-gradient(135deg, #FF7043, #FF5722);
            color: white;
            width: 38px;
            height: 38px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px 10px 10px 2px;
            margin-right: 8px;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 4px 15px rgba(255, 112, 67, 0.4);
        }

        .brand-text {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            font-size: 15px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #FF7043;
            text-shadow: 0 0 10px rgba(255, 112, 67, 0.5);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
        }

        /* Background Soft Orbs (iOS style) */
        .hero::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 112, 67, 0.15), transparent);
            top: 20%;
            left: 10%;
            z-index: -1;
            filter: blur(50px);
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 60px 40px;
            max-width: 850px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .hero-text h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to bottom, #ffffff, #b0c4de);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-text p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: rgba(255, 255, 255, 0.7);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            background: linear-gradient(135deg, #FF7043, #FF5722);
            color: white;
            padding: 16px 45px;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(255, 112, 67, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 112, 67, 0.5);
        }

        @media (max-width: 768px) {
            .hero-text h1 { font-size: 2.5rem; }
            header { width: 95%; padding: 10px 20px; }
            nav ul { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="#" class="logo">
                <div class="w-icon-container">W</div>
                <div class="brand-text">ADANA.LK</div>
            </a>
            <ul>
                <li><a href="#">මුල් පිටුව</a></li>
                <li><a href="#">සේවා</a></li>
                <li><a href="#">සම්බන්ධ වන්න</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-card">
            <div class="hero-text">
                <h1>අපි ලස්සන වෙබ් අඩවි නිර්මාණය කරමු</h1>
                <p>නවීන තාක්ෂණය සහ නිර්මාණශීලීත්වය එකම තැනක මුසු කරමින් ඔබේ සිහිනය සැබෑ කරමු.</p>
                <button class="btn">වැඩිදුර විස්තර</button>
            </div>
        </div>
    </section>

</body>
</html>
